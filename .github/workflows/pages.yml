name: Deploy to GitHub Pages

# ビルドは不要なので、リポジトリの中身をそのまま Pages へ配置する
#
# 公開できるのは main だけ（GitHub の github-pages 環境が main 以外からの
# 公開を拒むため）。作業用のブランチもここに並べていたので、押すたびに
# 必ず失敗し、失敗の知らせがメールで届いていた。main だけにする。
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pages を設定（未設定なら有効化する）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 発注ページは Cloudflare（yuadezabin.com）から出す。
      # ここへ一緒に上げると、同じフォームが2か所に出てしまい、
      # しかもこちらには受け口が無いので、開いた人が送れずに困る。
      - name: 発注ページを外す
        run: rm -rf order

      - name: 静的ファイルをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Pages へ公開
        id: deployment
        uses: actions/deploy-pages@v4
