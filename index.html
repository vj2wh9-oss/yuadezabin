<!-- 起動のいちばん最初に出る一枚。365 が回って止まったら、ホームに入る。
     ここに直に書いてあるので、読み込みを待たずにすぐ出る -->
<div id="splash" class="splash" role="img" aria-label="METEO365">
  <div class="splash-logo" aria-hidden="true">
    <b class="splash-word">METEO</b>
    <span class="splash-num">
      <span class="splash-reel"><span class="splash-strip" style="--land:13"><i>0</i><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><i>6</i><i>7</i><i>8</i><i>9</i><i>0</i><i>1</i><i>2</i><i>3</i></span></span>
      <span class="splash-reel"><span class="splash-strip" style="--land:16"><i>0</i><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><i>6</i><i>7</i><i>8</i><i>9</i><i>0</i><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><i>6</i></span></span>
      <span class="splash-reel"><span class="splash-strip" style="--land:15"><i>0</i><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i><i>6</i><i>7</i><i>8</i><i>9</i><i>0</i><i>1</i><i>2</i><i>3</i><i>4</i><i>5</i></span></span>
    </span>
  </div>
</div>

<header class="appbar" id="appbar">
  <div class="appbar-inner">
    <button class="iconbtn" id="backBtn" hidden aria-label="戻る" data-icon="chevronLeft" data-size="22"></button>
    <h1 class="appbar-title" id="appTitle">METEO365</h1>
    <a class="iconbtn gearbtn" id="gearBtn" href="#/settings" aria-label="設定" data-icon="settings" data-size="20"></a>
    <a class="iconbtn ideabtn" id="ideaBtn" href="#/ideas" aria-label="ひらめきメモ" data-icon="idea" data-size="20"></a>
    <a class="iconbtn searchbtn" id="searchBtn" href="#/search" aria-label="検索" data-icon="search" data-size="20"></a>
    <button class="modebtn" id="modeBtn" hidden aria-label="カレンダーを切り替える"></button>
    <span class="appbar-gap"></span>
    <div class="appbar-actions" id="appActions"></div>
  </div>
</header>

<main id="view" class="view" role="main"></main>

<!-- 発注の受け口。案件タブでだけ、＋の左に同じ大きさで並べる -->
<button class="fab fab-sub" id="fabOrders" aria-label="発注の一覧を開く" data-icon="client" data-size="24" hidden></button>
<button class="fab" id="fab" aria-label="新規作成" data-icon="plus" data-size="26"></button>

<nav class="tabbar" id="tabbar" role="navigation">
  <a class="tab" href="#/home"     data-tab="home"><span class="tabicon" data-icon="home"></span><span>ホーム</span></a>

  <a class="tab" href="#/books"    data-tab="books"><span class="tabicon" data-icon="books"></span><span>経理</span></a>
  <a class="tab" href="#/files"    data-tab="files"><span class="tabicon" data-icon="folder"></span><span>ファイル</span></a>
